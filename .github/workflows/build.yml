name: Multi-OS Binary Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: linux-x64
            extension: ""
            ort_asset: onnxruntime-linux-x64-1.20.1.tgz
          - os: windows-latest
            artifact_name: win-x64
            extension: ".exe"
            ort_asset: onnxruntime-win-x64-1.20.1.zip
          - os: macos-latest
            artifact_name: macos-arm64
            extension: ""
            ort_asset: onnxruntime-osx-arm64-1.20.1.tgz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── Dependencies ────────────────────────────────────────────────────────

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev build-essential cmake curl zip

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install opencv -y --no-progress
          $candidates = @("C:\tools\opencv\build", "C:\opencv\build")
          $found = $candidates | Where-Object { Test-Path "$_\OpenCVConfig.cmake" } | Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem -Path "C:\" -Recurse -Filter "OpenCVConfig.cmake" -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          if ($found) {
            echo "OpenCV_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Error "Could not find OpenCVConfig.cmake."
            exit 1
          }

      - name: Install Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install opencv cmake

      # ─── ONNX Runtime ────────────────────────────────────────────────────────

      - name: Download ONNX Runtime
        shell: bash
        run: |
          ORT_VERSION="1.20.1"
          URL="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${{ matrix.ort_asset }}"
          curl -L -o ort_archive "${URL}"
          if [[ "${{ matrix.ort_asset }}" == *.zip ]]; then
            unzip ort_archive -d ort_extracted
            ORT_SUBDIR=$(ls -d ort_extracted/onnxruntime-win-x64-* 2>/dev/null | head -1)
            echo "ONNXRUNTIME_DIR=$GITHUB_WORKSPACE/${ORT_SUBDIR:-ort_extracted}" >> $GITHUB_ENV
          else
            mkdir -p ort_extracted
            tar -xzf ort_archive -C ort_extracted --strip-components=1
            echo "ONNXRUNTIME_DIR=$GITHUB_WORKSPACE/ort_extracted" >> $GITHUB_ENV
          fi

      # ─── Build ───────────────────────────────────────────────────────────────

      - name: Configure and Build
        shell: bash
        run: |
          mkdir build && cd build
          CMAKE_ARGS="-DONNXRUNTIME_DIR=${ONNXRUNTIME_DIR} -DCMAKE_BUILD_TYPE=Release"
          [[ "${{ matrix.os }}" == "windows-latest" ]] && CMAKE_ARGS="$CMAKE_ARGS -DOpenCV_DIR=${OpenCV_DIR}"
          cmake .. $CMAKE_ARGS
          cmake --build . --config Release --parallel

      # ─── Prepare Binaries ────────────────────────────────────────────────────

      - name: Prepare Binaries
        shell: bash
        run: |
          mkdir -p release_binaries/${{ matrix.artifact_name }}
          BUILD_OUT=$([[ "${{ matrix.os }}" == "windows-latest" ]] && echo "build/Release" || echo "build")
          EXES=("image_inference" "video_inference" "camera_inference" "class_image_inference" "batch_image_inference")
          for exe in "${EXES[@]}"; do
            [ -f "${BUILD_OUT}/${exe}${{ matrix.extension }}" ] && cp "${BUILD_OUT}/${exe}${{ matrix.extension }}" "release_binaries/${{ matrix.artifact_name }}/"
          done
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "${ONNXRUNTIME_DIR}/lib/onnxruntime.dll" "release_binaries/${{ matrix.artifact_name }}/"
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cp "${ONNXRUNTIME_DIR}/lib/libonnxruntime.so"* "release_binaries/${{ matrix.artifact_name }}/"
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cp "${ONNXRUNTIME_DIR}/lib/libonnxruntime."*.dylib "release_binaries/${{ matrix.artifact_name }}/"
          fi

      # ─── Package ─────────────────────────────────────────────────────────────

      - name: Package Binaries
        shell: bash
        run: |
          VERSION=$([[ "${{ github.ref_type }}" == "tag" ]] && echo "${{ github.ref_name }}" || echo "latest")
          cd release_binaries/${{ matrix.artifact_name }}
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            zip -r ../../yolos-cpp-${VERSION}-${{ matrix.artifact_name }}.zip .
          else
            tar -czf ../../yolos-cpp-${VERSION}-${{ matrix.artifact_name }}.tar.gz .
          fi

      # ─── Checksum ────────────────────────────────────────────────────────────

      - name: Generate Checksum
        shell: bash
        run: |
          VERSION=$([[ "${{ github.ref_type }}" == "tag" ]] && echo "${{ github.ref_name }}" || echo "latest")
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            sha256sum yolos-cpp-${VERSION}-${{ matrix.artifact_name }}.zip > yolos-cpp-${VERSION}-${{ matrix.artifact_name }}.sha256
          else
            sha256sum yolos-cpp-${VERSION}-${{ matrix.artifact_name }}.tar.gz > yolos-cpp-${VERSION}-${{ matrix.artifact_name }}.sha256
          fi

      # ─── Upload Artifact ─────────────────────────────────────────────────────

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.artifact_name }}
          path: yolos-cpp-*.*

  publish_binaries:
    name: Update Binaries Branch
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout binaries branch
        uses: actions/checkout@v4
        with:
          ref: binaries
          path: binaries_repo

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize and Commit Binaries
        run: |
          VERSION=${{ github.ref_name }}
          mkdir -p binaries_repo/versions/${VERSION}
          
          # Copy artifacts to versioned folders
          cp artifacts/sdk-linux-x64/yolos-cpp-${VERSION}-linux-x64.tar.gz binaries_repo/versions/${VERSION}/
          cp artifacts/sdk-win-x64/yolos-cpp-${VERSION}-win-x64.zip binaries_repo/versions/${VERSION}/
          cp artifacts/sdk-macos-arm64/yolos-cpp-${VERSION}-macos-arm64.tar.gz binaries_repo/versions/${VERSION}/
          
          # Update 'latest' symlinks or copies
          mkdir -p binaries_repo/latest
          cp binaries_repo/versions/${VERSION}/* binaries_repo/latest/
          
          cd binaries_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish binaries for ${VERSION}"
          git push origin binaries

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge checksums
        run: find artifacts -name "*.sha256" -exec cat {} \; > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## 🚀 Release ${{ github.ref_name }}
            Automatically built from tag `${{ github.ref_name }}`.
            
            ### Assets
            Check the attached files for binaries for Linux, Windows, and macOS.
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            checksums.txt
